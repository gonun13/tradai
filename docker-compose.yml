services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tradai-data:/data
    environment:
      TRADAI_DATA_DIR: /data
      WORKER_BASE_URL: http://worker:8090
      ADVISORY_AFTER_US_CLOSE_MINUTES: ${ADVISORY_AFTER_US_CLOSE_MINUTES:-30}
      ADVISORY_INTERVAL_SECONDS: ${ADVISORY_INTERVAL_SECONDS:-86400}
      ADVISORY_MAX_SCENARIO_ROUNDS: ${ADVISORY_MAX_SCENARIO_ROUNDS:-0}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  ui:
    build: ./ui
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_API_INTERNAL_BASE: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build: ./worker
    volumes:
      - tradai-data:/data
    environment:
      TRADAI_DATA_DIR: /data
      WORKER_HEARTBEAT_SECONDS: "30"
      WORKER_QUOTE_INTERVAL_SECONDS: "900"
      # Marketaux free tier = 100 req/day; news is cached in SQLite (1 pass/day).
      WORKER_NEWS_INTERVAL_SECONDS: "86400"
      WORKER_HTTP_PORT: "8090"
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      MARKETAUX_API_TOKEN: ${MARKETAUX_API_TOKEN:-}
      IBKR_ENABLED: ${IBKR_ENABLED:-0}
      # Subscription OAuth only (never set ANTHROPIC_API_KEY here)
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      ADVISORY_MAX_SCENARIO_ROUNDS: ${ADVISORY_MAX_SCENARIO_ROUNDS:-0}
      ADVISORY_INTERVAL_SECONDS: ${ADVISORY_INTERVAL_SECONDS:-86400}
      # Post–US-close advisory (America/New_York 16:00 + offset minutes)
      ADVISORY_AFTER_US_CLOSE_MINUTES: ${ADVISORY_AFTER_US_CLOSE_MINUTES:-30}
      ADVISORY_SCHEDULE_CHECK_SECONDS: ${ADVISORY_SCHEDULE_CHECK_SECONDS:-60}
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tradai-data:
